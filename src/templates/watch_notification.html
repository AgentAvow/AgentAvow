<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background-color:#0a0e18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#0a0e18;">{{headline}} — {{score_line}}</div>
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#0a0e18;padding:36px 16px;">
    <tr><td align="center">
      <table width="520" cellpadding="0" cellspacing="0" role="presentation" style="max-width:520px;width:100%;">
        <tr><td style="padding:2px 4px 20px;">
          <img src="https://agentavow.com/apple-touch-icon.png" width="28" height="28" alt="AgentAvow" style="border-radius:7px;vertical-align:middle;border:0;" />
          <span style="color:#eef2fb;font-size:19px;font-weight:800;letter-spacing:-0.3px;vertical-align:middle;padding-left:9px;">AgentAvow</span>
        </td></tr>

        <tr><td style="background-color:#111a2e;border-radius:16px;border-top:4px solid {{accent}};">
          <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
            <tr><td style="padding:30px 32px 0;">
              <span style="display:inline-block;background-color:#0a0e18;color:{{accent}};font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;padding:5px 11px;border-radius:6px;">{{tag}}</span>
              <h1 style="color:#eef2fb;font-size:21px;font-weight:800;margin:16px 0 4px;line-height:1.3;">{{headline}}</h1>
              <p style="color:#63728f;font-size:13px;font-family:'SF Mono',Menlo,Consolas,monospace;margin:0 0 22px;word-break:break-all;">{{repo}}</p>
            </td></tr>

            <tr><td style="padding:0 32px 24px;">
              <table cellpadding="0" cellspacing="0" role="presentation" style="background-color:#0a0e18;border-radius:14px;"><tr>
                <td style="padding:18px 22px;">
                  <div style="color:#63728f;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;font-family:'SF Mono',Menlo,Consolas,monospace;margin-bottom:8px;">Trust</div>
                  <div style="color:{{badge_color}};font-size:40px;font-weight:800;line-height:1;">{{new_score}}<span style="color:#63728f;font-size:16px;font-weight:600;">/100</span></div>
                  <div style="margin-top:10px;">{{trust_bar}}</div>
                  <div style="color:{{accent}};font-size:13px;font-weight:600;margin-top:10px;">{{score_line}}</div>
                </td>
              </tr></table>
            </td></tr>

            <tr><td style="padding:0 32px 26px;">
              <p style="color:#c3ccdf;font-size:15px;line-height:1.6;margin:0;">{{message}}</p>
            </td></tr>

            <tr><td style="padding:0 32px 32px;">
              <a href="{{cta_url}}" style="display:inline-block;background-color:{{accent}};color:#06231f;text-decoration:none;padding:13px 30px;border-radius:10px;font-weight:700;font-size:15px;">{{cta_label}} &rarr;</a>
            </td></tr>
          </table>
        </td></tr>

        <tr><td style="padding:18px 8px 0;">
          <p style="color:#63728f;font-size:12px;line-height:1.5;margin:0;">You're getting this because you watch <span style="color:#93a1c0;">{{repo}}</span> on AgentAvow &mdash; we re-scan it and tell you when it changes. <a href="{{watches_url}}" style="color:#2dd4bf;text-decoration:none;">Manage your watches</a>.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
