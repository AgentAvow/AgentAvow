<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#0f172a;padding:36px 16px;">
    <tr><td align="center">
      <table width="520" cellpadding="0" cellspacing="0" role="presentation" style="max-width:520px;width:100%;">
        <tr><td style="padding:2px 4px 20px;">
          <img src="https://agentavow.com/apple-touch-icon.png" width="28" height="28" alt="AgentAvow" style="border-radius:7px;vertical-align:middle;border:0;" />
          <span style="color:#f1f5f9;font-size:19px;font-weight:800;letter-spacing:-0.3px;vertical-align:middle;padding-left:9px;font-family:'Geist','Geist Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">AgentAvow</span>
        </td></tr>

        <tr><td style="background-color:#1e293b;border-radius:16px;border-top:4px solid {{accent}};">
          <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
            <tr><td style="padding:30px 32px 0;">
              <span style="display:inline-block;background-color:#0f172a;color:{{accent}};font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;padding:5px 11px;border-radius:6px;">{{tag}}</span>
              <h1 style="color:#f1f5f9;font-size:21px;font-weight:800;margin:16px 0 4px;line-height:1.3;">{{headline}}</h1>
              <p style="color:#64748b;font-size:13px;font-family:'SF Mono',Menlo,Consolas,monospace;margin:0 0 22px;word-break:break-all;">{{repo}}</p>
            </td></tr>

            <tr><td style="padding:0 32px 22px;">
              <table cellpadding="0" cellspacing="0" role="presentation"><tr>
                <td style="width:70px;height:70px;background-color:#0f172a;border-radius:16px;text-align:center;vertical-align:middle;">
                  <span style="color:{{badge_color}};font-size:28px;font-weight:800;">{{grade}}</span>
                </td>
                <td style="padding-left:16px;vertical-align:middle;">
                  <div style="color:#f1f5f9;font-size:26px;font-weight:800;line-height:1;">{{new_score}}<span style="color:#475569;font-size:15px;font-weight:600;">/100</span></div>
                  <div style="color:{{accent}};font-size:13px;font-weight:600;margin-top:5px;">{{score_line}}</div>
                </td>
              </tr></table>
            </td></tr>

            <tr><td style="padding:0 32px 26px;">
              <p style="color:#cbd5e1;font-size:15px;line-height:1.6;margin:0;">{{message}}</p>
            </td></tr>

            <tr><td style="padding:0 32px 32px;">
              <a href="{{cta_url}}" style="display:inline-block;background-color:{{accent}};color:#0f172a;text-decoration:none;padding:13px 30px;border-radius:10px;font-weight:700;font-size:15px;">{{cta_label}} &rarr;</a>
            </td></tr>
          </table>
        </td></tr>

        <tr><td style="padding:18px 8px 0;">
          <p style="color:#475569;font-size:12px;line-height:1.5;margin:0;">You're getting this because you watch <span style="color:#94a3b8;">{{repo}}</span> on AgentAvow &mdash; we re-scan it and tell you when it changes. <a href="{{watches_url}}" style="color:#818cf8;text-decoration:none;">Manage your watches</a>.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
