<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background-color:#0a0e18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#0a0e18;">An approved marketing post failed to publish on {{platform}}.</div>
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#0a0e18;padding:36px 16px;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" role="presentation" style="max-width:560px;width:100%;">
        <tr><td style="padding:2px 4px 20px;">
          <img src="https://agentavow.com/apple-touch-icon.png" width="28" height="28" alt="AgentAvow" style="border-radius:7px;vertical-align:middle;border:0;" />
          <span style="color:#eef2fb;font-size:19px;font-weight:800;letter-spacing:-0.3px;vertical-align:middle;padding-left:9px;">AgentAvow</span>
        </td></tr>
        <tr><td style="background-color:#111a2e;border-radius:16px;border-top:4px solid #ef4444;">
          <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
            <tr><td style="padding:30px 32px 0;">
              <span style="display:inline-block;background-color:#0a0e18;color:#ef4444;font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;padding:5px 11px;border-radius:6px;">Post failed</span>
              <h1 style="color:#eef2fb;font-size:21px;font-weight:800;margin:16px 0 12px;line-height:1.3;">A post failed to publish</h1>
            </td></tr>
            <tr><td style="padding:0 32px 22px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#0a0e18;border-radius:12px;"><tr><td style="padding:16px 18px;">
                <p style="margin:0 0 4px;color:#63728f;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;">Platform</p>
                <p style="margin:0 0 14px;color:#eef2fb;font-size:14px;font-weight:600;">{{platform}}</p>
                <p style="margin:0 0 4px;color:#63728f;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;">Content preview</p>
                <p style="margin:0 0 14px;color:#93a1c0;font-size:14px;line-height:1.5;">{{content_preview}}</p>
                <p style="margin:0 0 4px;color:#63728f;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;">Error</p>
                <p style="margin:0;color:#ef4444;font-size:14px;font-weight:600;line-height:1.5;">{{error}}</p>
              </td></tr></table>
            </td></tr>
            <tr><td style="padding:0 32px 32px;">
              <a href="{{dashboard_url}}" style="display:inline-block;background-color:#2dd4bf;color:#06231f;text-decoration:none;padding:13px 30px;border-radius:10px;font-weight:700;font-size:15px;">View in dashboard &rarr;</a>
            </td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:18px 8px 0;">
          <p style="color:#63728f;font-size:12px;line-height:1.5;margin:0;">You can retry the post from the Marketing tab in the admin dashboard.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
