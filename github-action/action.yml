name: "AgentAvow Trust Scan"
description: "Check the security posture of your repo with AgentAvow"
author: "AgentAvow (agentavow.com)"

branding:
  icon: "shield"
  color: "blue"

inputs:
  fail_on:
    description: "Fail the workflow on this decision or worse: do_not_connect (default), review, or none"
    required: false
    default: "do_not_connect"
  min_score:
    description: "Legacy: minimum trust score (0-100) checked when fail_on_findings is true (51 when unset)"
    required: false
    default: ""
  fail_on_findings:
    description: "Legacy: fail the workflow if the score is below min_score"
    required: false
    default: "false"
  comment_on_pr:
    description: "Post a comment on the PR with scan results"
    required: false
    default: "true"
  fail_on_behavioral:
    description: "Fail the workflow if the behavioral sandbox run has a high/critical finding"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install jq
      shell: bash
      run: |
        if ! command -v jq &> /dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
        fi

    - name: Run AgentAvow Trust Scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        FAIL_ON: ${{ inputs.fail_on }}
        MIN_SCORE: ${{ inputs.min_score }}
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        COMMENT_ON_PR: ${{ inputs.comment_on_pr }}
        FAIL_ON_BEHAVIORAL: ${{ inputs.fail_on_behavioral }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash ${{ github.action_path }}/scan.sh
