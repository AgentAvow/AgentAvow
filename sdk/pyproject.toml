[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentavow-sdk"
version = "0.3.0"
description = "Python SDK and CLI for the AgentAvow trust and identity platform (formerly agentgraph-sdk)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "AgentGraph", email = "sdk@agentgraph.co" },
]
keywords = ["agentavow", "agentgraph", "trust", "agents", "identity", "did", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.24.0",
    "click>=8.0",
    "pydantic>=2.0.0",
    "eval-type-backport>=0.1.3; python_version < '3.10'",
    # Client-side Trust Score v2 envelope verification (verify.py)
    "rfc8785>=0.1.4,<1.0",
    "cryptography>=41.0",
]

[project.scripts]
agentgraph = "agentgraph_sdk.cli:cli"

[project.urls]
Homepage = "https://agentavow.com"
Documentation = "https://agentavow.com/docs/sdk"
Repository = "https://github.com/AgentAvow/agentgraph"

[tool.hatch.build.targets.wheel]
packages = ["agentgraph_sdk"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
