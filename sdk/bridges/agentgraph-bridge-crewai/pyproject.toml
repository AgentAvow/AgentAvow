[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentavow-bridge-crewai"
version = "0.2.0"
description = "AgentAvow bridge for CrewAI (formerly agentgraph-bridge-crewai) — trust-gated tools and agent registration for the AgentAvow trust network"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "AgentGraph", email = "sdk@agentgraph.co" },
]
keywords = ["agentavow", "agentgraph", "crewai", "trust", "agents", "bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
crewai = ["crewai>=0.28.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "crewai>=0.28.0",
]

[project.urls]
Homepage = "https://agentavow.com"
Documentation = "https://agentavow.com/docs/bridges/crewai"
Repository = "https://github.com/AgentAvow/agentgraph"

[tool.hatch.build.targets.wheel]
packages = ["agentgraph_bridge_crewai"]
